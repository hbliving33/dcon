<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200"><defs>
    <clipPath id="disc"><circle cx="100" cy="100" r="86"/></clipPath>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6578"/><stop offset=".5" stop-color="#1a1f2b"/><stop offset="1" stop-color="#3c4558"/>
    </linearGradient>
    <linearGradient id="dFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#eef1f6"/><stop offset="1" stop-color="#b9c1cf"/>
    </linearGradient>
    <radialGradient id="shade" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/>
    </radialGradient>
    <polygon id="st" points="0,-5 1.18,-1.62 4.76,-1.55 1.9,0.62 2.94,4.05 0,2 -2.94,4.05 -1.9,0.62 -4.76,-1.55 -1.18,-1.62"/>
    <path id="dShape" fill-rule="evenodd" d="M60 44 H104 C140 44 158 68 158 100 C158 132 140 156 104 156 H60 Z M86 70 H102 C122 70 131 82 131 100 C131 118 122 130 102 130 H86 Z"/>
    <g id="badge">
      <circle cx="100" cy="100" r="96" fill="url(#rim)"/>
      <circle cx="100" cy="100" r="88" fill="#0b0f18"/>
      <g clip-path="url(#disc)">
        <rect x="0" y="0" width="200" height="200" fill="#ffffff"/>
        <g fill="#c8102e">
          <rect x="0" y="14" width="200" height="15.4"/><rect x="0" y="44.8" width="200" height="15.4"/>
          <rect x="0" y="75.6" width="200" height="15.4"/><rect x="0" y="106.4" width="200" height="15.4"/>
          <rect x="0" y="137.2" width="200" height="15.4"/><rect x="0" y="168" width="200" height="15.4"/>
        </g>
        <rect x="0" y="0" width="96" height="106.4" fill="#0a2a6b"/>
        <g fill="#fff">
          <use href="#st" x="30" y="30"/><use href="#st" x="50" y="30"/><use href="#st" x="70" y="30"/>
          <use href="#st" x="20" y="46"/><use href="#st" x="40" y="46"/><use href="#st" x="60" y="46"/><use href="#st" x="80" y="46"/>
          <use href="#st" x="30" y="62"/><use href="#st" x="50" y="62"/><use href="#st" x="70" y="62"/>
          <use href="#st" x="20" y="78"/><use href="#st" x="40" y="78"/><use href="#st" x="60" y="78"/><use href="#st" x="80" y="78"/>
          <use href="#st" x="30" y="94"/><use href="#st" x="50" y="94"/><use href="#st" x="70" y="94"/>
        </g>
        <rect x="0" y="0" width="200" height="200" fill="url(#shade)"/>
        <!-- D: shadow, dark keyline, bevel, face -->
        <use href="#dShape" fill="#000" opacity=".45" transform="translate(5 6)"/>
        <use href="#dShape" fill="#141821" stroke="#141821" stroke-width="12" stroke-linejoin="round"/>
        <use href="#dShape" fill="#8a93a6" transform="translate(2.5 3)"/>
        <use href="#dShape" fill="url(#dFace)"/>
      </g>
      <circle cx="100" cy="100" r="88" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1.5"/>
      <circle cx="100" cy="100" r="95" fill="none" stroke="#000" stroke-opacity=".6" stroke-width="2"/>
    </g>
  </defs><use href="#badge" xlink:href="#badge"/></svg>
